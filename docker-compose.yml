# 開発環境。使い方は readme.md の「開発環境 (Docker)」を参照
# 本番用 (将来 Docker で運用する場合) は docker-compose.prod.yml
name: sakkyoku-dev

x-host-user: &host-user
  # ホストと共有するファイルを、ホストの利用者の権限で作る (Linux では .env に id -u / id -g の値を設定する)
  user: "${SAKKYOKU_UID:-1000}:${SAKKYOKU_GID:-1000}"

services:
  db:
    image: mariadb:11.4
    environment:
      - MARIADB_USER=noverdi
      - MARIADB_PASSWORD=${SAKKYOKU_DB_PASSWORD:?Set SAKKYOKU_DB_PASSWORD in .env}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
      - MARIADB_DATABASE=noverdi
    ports:
      - "127.0.0.1:5201:3306"
    volumes:
      - "dbdata:/var/lib/mysql"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Django の開発サーバー (http://localhost:8000)。ソースの変更は自動で反映される
  web:
    build:
      context: .
      target: dev
    <<: *host-user
    environment:
      - DEPLOY_ENV=dev
      - SAKKYOKU_DB_HOST=db
      - SAKKYOKU_SQL_PASSWORD=${SAKKYOKU_DB_PASSWORD:?Set SAKKYOKU_DB_PASSWORD in .env}
      - SAKKYOKU_SECRET_KEY=${SAKKYOKU_SECRET_KEY:?Set SAKKYOKU_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ".:/usr/src/app"
    depends_on:
      db:
        condition: service_healthy

  # TypeScript を監視してビルドし、sakkyokuapp/static/sakkyokuapp/javascript/ に出力する
  js:
    image: node:24-alpine
    <<: *host-user
    working_dir: /usr/src/app/scripts
    environment:
      - npm_config_cache=/tmp/.npm
      - WATCHPACK_POLLING=true
    command: sh -c "npm ci && exec npx webpack --watch --output-path ../sakkyokuapp/static/sakkyokuapp/javascript"
    volumes:
      - "./scripts:/usr/src/app/scripts"
      - "./sakkyokuapp/static/sakkyokuapp/javascript:/usr/src/app/sakkyokuapp/static/sakkyokuapp/javascript"

  # 音源(WASM)のビルド。音源を scripts/sf2js/ に置いてから docker compose run --rm wasm で実行する
  # 音源のファイル名は .env の SAKKYOKU_SF2 で指定する (既定は soundfont.sf2)
  wasm:
    image: emscripten/emsdk:6.0.12
    profiles: ["tools"]
    <<: *host-user
    working_dir: /src/scripts/sf2js
    environment:
      - SF2=${SAKKYOKU_SF2:-soundfont.sf2}
    # 音源を替えたときも作り直すよう、毎回ビルドする (-B)
    command: sh -c "make -B wasm && cp tfs.js tfs.wasm tfs.data ../../sakkyokuapp/static/sakkyokuapp/javascript/"
    volumes:
      - ".:/src"

volumes:
  dbdata:
